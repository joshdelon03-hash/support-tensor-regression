[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-tensor-regression"
version = "0.1.0"
authors = [
  { name="Josh Delon", email="joshdelon03@example.com" },
]
description = "A lightweight implementation of Support Tensor Regression (STR) using scikit-learn SVR."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scikit-learn",
]

[tool.setuptools]
py-modules = ["str_model"]
